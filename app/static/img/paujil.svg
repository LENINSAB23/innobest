<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bgPaujil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="redBeak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bgPaujil)"/>
  
  <!-- Hojas de selva tropical profunda Tingo María -->
  <path d="M 320 280 C 260 210, 310 140, 390 180 Z" fill="#059669" opacity="0.25"/>
  <path d="M 10 50 C 90 40, 110 110, 40 130 Z" fill="#10b981" opacity="0.2"/>

  <!-- Patas robustas -->
  <line x1="200" y1="205" x2="195" y2="265" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="225" y1="205" x2="230" y2="265" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="195" y1="265" x2="175" y2="272" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="265" x2="250" y2="272" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Cola ancha negra -->
  <path d="M 140 170 L 70 205 L 80 225 L 155 195 Z" fill="#090d16"/>

  <!-- Vientre blanco o castaño claro -->
  <ellipse cx="205" cy="180" rx="40" ry="25" fill="#f8fafc"/>

  <!-- Gran cuerpo negro azabache lustroso con brillo azulado -->
  <ellipse cx="195" cy="160" rx="70" ry="48" fill="#090d16"/>
  <ellipse cx="185" cy="155" rx="50" ry="32" fill="#0f172a"/>

  <!-- Cuello estilizado negro -->
  <path d="M 230 155 C 245 130, 240 90, 225 70 C 210 75, 220 120, 210 155 Z" fill="#090d16"/>

  <!-- Cabeza -->
  <circle cx="230" cy="72" r="18" fill="#090d16"/>

  <!-- CRESTA RIZADA DE PLUMAS ERÉCTILES (rasgo distintivo del Paujil) -->
  <path d="M 226 55 C 220 42, 230 38, 235 44 C 238 36, 248 38, 245 46 C 252 42, 258 48, 252 54" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="228" cy="42" r="3.5" fill="#1e293b"/>
  <circle cx="238" cy="40" r="3.5" fill="#1e293b"/>
  <circle cx="248" cy="44" r="3.5" fill="#1e293b"/>

  <!-- Ojo marrón rojizo -->
  <circle cx="238" cy="68" r="3.5" fill="#ea580c"/>
  <circle cx="238" cy="68" r="1.8" fill="#020617"/>

  <!-- PROTUBERANCIA CARNOSA / PICO ROJO ESCARLATA (Paujil tuberoso / Crax) -->
  <ellipse cx="249" cy="68" rx="8" ry="10" fill="url(#redBeak)"/>
  <!-- Punta del pico marfil/negro -->
  <path d="M 252 68 L 274 74 L 254 79 Z" fill="#fef08a"/>

  <!-- Etiqueta UICN -->
  <rect x="235" y="24" width="145" height="30" rx="8" fill="#991b1b" opacity="0.95"/>
  <text x="307" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PELIGRO CRÍTICO (CR)</text>
</svg>
